[project]
name = "nova-api"
version = "1.0.0b1"
description = "NOVA v1 Beta API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141.1,<0.142.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0.54,<2.1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
